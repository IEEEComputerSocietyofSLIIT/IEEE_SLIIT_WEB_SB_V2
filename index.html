<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#08172d" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="format-detection" content="telephone=no" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https:; frame-src 'self' https://maps.google.com https://www.google.com; object-src 'none'; base-uri 'self';" />
    
    <title>IEEE Student Branch of SLIIT</title>
    <meta name="description" content="Explore IEEE SLIIT events, meet our student leaders, and discover opportunities to learn, volunteer, and connect." />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="IEEE Student Branch of SLIIT" />
    <meta property="og:description" content="Explore IEEE SLIIT events, meet our student leaders, and discover opportunities to learn, volunteer, and connect." />
    <meta property="og:image" content="/android-chrome-512x512.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="IEEE Student Branch of SLIIT" />
    <meta name="twitter:description" content="Explore IEEE SLIIT events, meet our student leaders, and discover opportunities to learn, volunteer, and connect." />
    <meta name="twitter:image" content="/android-chrome-512x512.png" />

    <!-- Performance: Preconnect map domain -->
    <link rel="preconnect" href="https://maps.google.com" />
    <link rel="dns-prefetch" href="https://maps.google.com" />

    <!-- Favicon and Icons -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="manifest" href="/site.webmanifest" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
